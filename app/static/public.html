<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公开数据发布</title>
<style>
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f4f6f8;color:#222}
  header{background:#2e6b4f;color:#fff;padding:14px 24px}
  header h1{margin:0;font-size:20px}
  main{max-width:900px;margin:20px auto;padding:0 16px}
  section{background:#fff;border-radius:8px;padding:16px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  h2{font-size:16px;margin:0 0 12px}
  table{border-collapse:collapse;margin-top:8px}
  th,td{border:1px solid #dde3ea;padding:6px 12px;font-size:14px;text-align:center}
  th{background:#eef2f6}
  .hint{font-size:13px;color:#667}
  textarea{width:100%;box-sizing:border-box;min-height:140px;font-family:ui-monospace,monospace;font-size:12px;padding:8px;border:1px solid #ccd4dc;border-radius:6px}
  button{background:#2e6b4f;color:#fff;border:0;border-radius:6px;padding:8px 16px;font-size:14px;cursor:pointer;margin-top:8px}
  .msg{margin-top:12px;padding:10px 12px;border-radius:6px;font-size:14px;white-space:pre-wrap;display:none}
  .msg.ok{display:block;background:#e6f6e8;border:1px solid #9ed3a7}
  .msg.err{display:block;background:#fdecea;border:1px solid #f2b8b0}
  .steps{font-size:13px;color:#445;margin-top:8px}
</style>
</head>
<body>
<header><h1>公开数据发布</h1></header>
<main>
  <section>
    <h2>调查人数（分区 × 年龄组）</h2>
    <div id="grid">加载中…</div>
  </section>
  <section>
    <h2>已获准公开的汇总</h2>
    <p class="hint">本页仅提供人数与获准汇总，不提供各格检出数。已签记录可下载回执留存；未签记录为旧发布，不能当作已核验。</p>
    <div id="pubs"></div>
  </section>
  <section>
    <h2>回执核验</h2>
    <p class="hint">粘贴发布时下载留存的回执 JSON，逐条对照签发链与库内记录；若公开记录被改动、删除或断链，将报告首处问题。</p>
    <textarea id="receiptText" placeholder='粘贴回执 JSON，例如 {"version":1,"publication_id":1,...}'></textarea>
    <br>
    <button onclick="doVerify()">核验回执</button>
    <div id="verifyMsg" class="msg"></div>
    <div id="verifySteps" class="steps"></div>
  </section>
</main>
<script>
function esc(s){return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function load(){
  const r = await (await fetch('/api/public')).json();
  if(!r.imported){
    document.getElementById('grid').innerHTML = '<p class="hint">尚未发布数据</p>';
    document.getElementById('pubs').innerHTML = '';
    return;
  }
  const ds = [...new Set(r.cells.map(c => c.district))].sort();
  const as = [...new Set(r.cells.map(c => c.age_group))].sort();
  const pop = {};
  for(const c of r.cells) pop[c.district + '|' + c.age_group] = c.population;
  let h = '<table><tr><th>分区</th>' + as.map(a => `<th>${esc(a)}</th>`).join('') + '</tr>';
  for(const d of ds)
    h += `<tr><td>${esc(d)}</td>` + as.map(a => `<td>${pop[d + '|' + a] ?? '—'}</td>`).join('') + '</tr>';
  document.getElementById('grid').innerHTML = h + '</table>';

  document.getElementById('pubs').innerHTML = r.publications.length
    ? '<table><tr><th>#</th><th>分区</th><th>年龄组</th><th>检出总数</th><th>发布时间 (UTC)</th><th>回执</th></tr>'
      + r.publications.map(p => `<tr><td>${p.id}</td><td>${esc(p.districts.join('、'))}</td><td>${esc(p.age_groups.join('、'))}</td><td>${p.total}</td><td>${esc(p.created_at)}</td>`
        + (p.signed
          ? `<td>已签 · <a href="/api/receipt/${p.id}" download>下载回执</a></td>`
          : '<td>未签（旧记录）</td>')
        + '</tr>').join('')
      + '</table>'
    : '<p class="hint">暂无公开汇总</p>';
}
async function doVerify(){
  const msg = document.getElementById('verifyMsg');
  const stepsEl = document.getElementById('verifySteps');
  stepsEl.textContent = '';
  const text = document.getElementById('receiptText').value.trim();
  if(!text){ msg.className = 'msg err'; msg.textContent = '请先粘贴回执 JSON'; return; }
  let r;
  try{
    const resp = await fetch('/api/verify', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({receipt_text: text}),
    });
    r = await resp.json();
  }catch(e){
    msg.className = 'msg err'; msg.textContent = '核验请求失败：' + e; return;
  }
  if(r.ok){
    msg.className = 'msg ok';
    msg.textContent = `核验通过：回执与第 #${r.verified_publication_id} 条发布记录一致，`
      + `自链首共 ${r.chain_length} 条已签记录逐条核验无误，签发链完整。`;
  }else{
    msg.className = 'msg err';
    msg.textContent = '核验未通过：' + (r.failure ? r.failure.message : '未知原因');
  }
  if(r.steps && r.steps.length){
    stepsEl.textContent = '逐条核验：' + r.steps.map(s => `#${s.publication_id} 通过`).join('；');
  }
}
load();
</script>
</body>
</html>
